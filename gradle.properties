# Cap the build JVM heap. Gradle's default is a quarter of the machine's RAM,
# which is measured against the host, not against whatever the dev container
# is actually allowed to use. On a small container host that estimate is too
# generous and the build takes the machine down with it instead of failing.
# 2 GB is ample for this project and leaves room for the test JVM.
org.gradle.jvmargs=-Xmx2g

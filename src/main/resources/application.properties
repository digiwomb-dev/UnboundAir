# Baseline settings of the application itself. The settings of the service
# live under unboundair.* and are documented in docs/konfiguration.md (DO-09);
# this file only tames the framework.

# The Spring banner is framework decoration, not output of this program. On a
# command line tool it pushes the actual answer off the screen, and in a
# container it is nine lines of ASCII art in the journal on every start.
#
# It is switched off here rather than in main(), because the tests boot the
# application through their own SpringApplicationBuilder and would otherwise
# still print it - the banner would then be part of the captured stdout and
# break the assertion that a command's result is bare text (KL-02).
spring.main.banner-mode=off

# The "Starting ... / No active profile set / Started in 0.4 seconds" lines are
# framework bookkeeping, not information about the scan. They are switched off
# here rather than with a logback rule because Spring emits them through a
# logger named after whichever class holds main(): UnboundAirApplicationKt for
# the packaged jar, GradleWorkerMain under the test runner. Silencing them by
# logger name would mean chasing every such name.
spring.main.log-startup-info=false

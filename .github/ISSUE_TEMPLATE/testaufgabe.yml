name: Test task
description: A test task with a fixed checklist (AI run: exactly one file; human: a file list).
title: "test: "
labels: []
body:
  - type: textarea
    id: requirements
    attributes:
      label: Requirement ID(s)
      description: "e.g. SV-01, SC-03 – the implemented IDs from docs/plan.md"
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: Test layer
      description: Also set as a label.
      options:
        - unit
        - property
        - slice
        - integration
        - contract
        - e2e
        - golden-master
        - mutation
        - guard
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: File or file list
      description: "AI run: exactly one file. Human: a list of the affected files."
    validations:
      required: true
  - type: textarea
    id: criterion
    attributes:
      label: Acceptance criterion
      description: What the acceptance is based on (verifiable).
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Test checklist
      options:
        - label: Requirement ID(s) referenced
          required: false
        - label: Test layer(s) set as label
          required: false
        - label: exactly one file (AI run) or file list (human); acceptance criterion named
          required: false
        - label: Test runs green in the dev container (commit SHA linked)
          required: false
        - label: Standard followed (AssertJ, backtick name with requirement ID)
          required: false
        - label: Mutation run (core packages only) documented
          required: false
        - label: no DC-03 violation (offline)
          required: false

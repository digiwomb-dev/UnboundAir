name: Implementation task
description: "One implementation file, or one concern with a file list."
title: "feat(scope): "
type: Feature
labels:
  - kind/feat
body:
  - type: markdown
    attributes:
      value: |
        Title: `feat(<scope>): <description>` — the scope is mandatory
        (`config`, `scanner`, `service`, `batch`, `cli`, `pdf`, `logging`,
        `output`, `outbox`, `processing`, `app`).
  - type: input
    id: requirements
    attributes:
      label: Requirement ID(s)
      description: "e.g. AU-04 – the implemented IDs from docs/internal/plan.md"
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: File or file list
      description: "Exactly one file. A list of the affected files only if one concern genuinely spans several."
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What is built
      description: The behaviour to implement, including the guardrails that apply.
    validations:
      required: true
  - type: textarea
    id: criterion
    attributes:
      label: Acceptance criterion
      description: What the acceptance is based on (verifiable).
    validations:
      required: true
  - type: input
    id: parent
    attributes:
      label: Parent
      description: "The parent task, e.g. #108. Leave empty for standalone work."
    validations:
      required: false

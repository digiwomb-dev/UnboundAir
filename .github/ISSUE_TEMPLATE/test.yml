name: Test task
description: "A test task with a fixed checklist. Exactly one file, or a file list for one concern."
title: "test(layer): "
type: Test
labels:
  - kind/test
body:
  - type: markdown
    attributes:
      value: |
        Title: `test(<layer>): <requirement IDs> <description>` — the prefix is the
        **test layer**, never the package. Set the layer below as a label as well.
  - type: textarea
    id: requirements
    attributes:
      label: Requirement ID(s)
      description: "e.g. SV-01, SC-03 – the implemented IDs from docs/plan.md"
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: Test layer
      description: Also set as a label, and used as the title prefix.
      options:
        - unit
        - property
        - slice
        - integration
        - contract
        - e2e
        - golden-master
        - mutation
        - guard
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: File or file list
      description: "Exactly one file. A list of the affected files only if one concern genuinely spans several."
    validations:
      required: true
  - type: textarea
    id: criterion
    attributes:
      label: Acceptance criterion
      description: What the acceptance is based on (verifiable).
    validations:
      required: true
  - type: input
    id: parent
    attributes:
      label: Parent
      description: "The parent task, e.g. #109. Leave empty for standalone work."
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Test checklist
      options:
        - label: Requirement ID(s) referenced
          required: false
        - label: Test layer(s) set as label
          required: false
        - label: exactly one file, or a file list for one concern; acceptance criterion named
          required: false
        - label: Test runs green in the dev container (commit SHA linked)
          required: false
        - label: Standard followed (AssertJ, backtick name with requirement ID)
          required: false
        - label: Mutation run (core packages only) documented
          required: false
        - label: no DC-03 violation (offline)
          required: false

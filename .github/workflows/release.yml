# CI-04: a pushed tag produces a GitHub release with the executable JAR attached
# and the matching image in GHCR under that version (docs/internal/plan.md).
#
# Strict SemVer 2.0.0 without a `v` prefix (`1.2.0`, never `v1.2.0`); the tag
# must equal `version` in build.gradle.kts and sit on a commit of `main`.
# A trigger pattern cannot express SemVer, so the trigger stays broad
# (`tags: *`) and the first job validates strictly and fails loudly with
# the reason — a mistyped tag that silently did nothing would leave a
# release-looking tag in the history that is not a release.
#
# What goes in: CI-01's tested jar from this run (never a rebuild), the
# images CI-03 verified in this run as one multi-architecture version tag
# (`latest` only for non-prereleases — nightly builds never touch it), and
# generated notes (they work because commits follow Conventional Commits
# with an issue reference each).
#
# The release is created as a draft, assets attached, and published last:
# publishing locks tag and assets under immutable releases, and a leftover
# draft from an aborted run is replaced while a published release is never
# touched. No signing or SBOM — deliberately out of this milestone.
name: release

on:
  push:
    tags:
      - "*"

# The release needs to write releases and push images; nothing more.
permissions:
  contents: write
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tag with full history
        # Full history: the main-ancestry check below needs it, and a
        # tag checkout leaves a detached HEAD by itself.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Validate the tag strictly
        # A glob trigger cannot tell `1.2.0` from `1.2.3.4`, so this step
        # does: full SemVer 2.0.0, no `v` prefix, tag equals the build
        # version, tag commit on main. Loud on every count, including what
        # to do about the bad tag (delete it — this workflow never rewrites
        # history on a trigger it did not fully validate).
        run: |
          TAG="${{ github.ref_name }}"
          SEMVER='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?(\+([0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*))?$'
          if [[ ! "$TAG" =~ $SEMVER ]]; then
            echo "tag '$TAG' is not strict SemVer without a 'v' prefix (expected e.g. 1.2.0 or 1.2.0-rc.1); delete it with: git push --delete origin $TAG" >&2
            exit 1
          fi
          BUILD_VERSION="$(grep -E '^version = "' build.gradle.kts | cut -d'"' -f2)"
          if [ "$TAG" != "$BUILD_VERSION" ]; then
            echo "tag '$TAG' differs from version '$BUILD_VERSION' in build.gradle.kts; bump the version by pull request first, then tag again — and delete this tag: git push --delete origin $TAG" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "tag '$TAG' sits on a commit outside main; tags are expected on main following the dev-to-main flow — delete it with: git push --delete origin $TAG" >&2
            exit 1
          fi
          echo "tag '$TAG' valid: SemVer, matches build.gradle.kts, on main."

  test:
    # The suite from CI-01, against the tag rather than a branch: inside a
    # called workflow the `github` context is the caller's, so the ref is
    # passed explicitly. Called by reference to main, where tags live —
    # pinning this to a SHA would freeze the workflow while releases move
    # on (same reason as nightly.yml calling @dev).
    needs: validate
    uses: digiwomb-dev/UnboundAir/.github/workflows/test.yml@main
    with:
      ref: ${{ github.ref }}
    secrets: inherit

  images:
    # The build CI-03 verifies in this run, fed with CI-01's tested jar;
    # its tarballs are kept as artefacts, which the publish job loads.
    needs: test
    uses: digiwomb-dev/UnboundAir/.github/workflows/image.yml@main
    with:
      ref: ${{ github.ref }}
      jar-artifact: unboundair-jar
    secrets: inherit

  publish:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        # gh release derives the repository from the git remote: without a
        # checkout it fails with "not a git repository". Shallow is enough
        # here — nothing in this job reads history.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download the tested jar and the verified images
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: unboundair-*
          merge-multiple: true
          path: dist

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the version images
        # Load and tag interleaved on purpose (both tarballs hold an image
        # named `unboundair:ci`, so loading the second before tagging the
        # first would silently retag the wrong architecture). OCI tags
        # forbid `+`, so build metadata becomes `-`; `latest` moves only
        # for real releases, never for pre-releases.
        run: |
          TAG="${{ github.ref_name }}"
          IMAGE_TAG="${TAG//+/-}"
          if [[ "$TAG" == *-* || "$TAG" == 0.* ]]; then PRE=true; else PRE=false; fi
          echo "PRE_RELEASE=$PRE" >> "$GITHUB_ENV"
          docker load -i dist/unboundair-image-arm64.tar
          docker tag unboundair:ci "ghcr.io/digiwomb-dev/unboundair:$IMAGE_TAG-arm64"
          docker push "ghcr.io/digiwomb-dev/unboundair:$IMAGE_TAG-arm64"
          docker load -i dist/unboundair-image-amd64.tar
          docker tag unboundair:ci "ghcr.io/digiwomb-dev/unboundair:$IMAGE_TAG-amd64"
          docker push "ghcr.io/digiwomb-dev/unboundair:$IMAGE_TAG-amd64"
          docker buildx imagetools create \
            -t "ghcr.io/digiwomb-dev/unboundair:$IMAGE_TAG" \
            "ghcr.io/digiwomb-dev/unboundair:$IMAGE_TAG-arm64" \
            "ghcr.io/digiwomb-dev/unboundair:$IMAGE_TAG-amd64"
          if [ "$PRE" = false ]; then
            docker buildx imagetools create \
              -t ghcr.io/digiwomb-dev/unboundair:latest \
              "ghcr.io/digiwomb-dev/unboundair:$IMAGE_TAG-arm64" \
              "ghcr.io/digiwomb-dev/unboundair:$IMAGE_TAG-amd64"
          fi

      - name: Create the release as a draft
        # Draft first, assets attached, published last: publishing locks tag
        # and assets under immutable releases. A leftover draft from an
        # aborted run of the same tag is replaced; a published release is
        # never touched. Notes are generated — Conventional Commits plus an
        # issue reference per commit make them work.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null | grep -qx true; then
            echo "replacing leftover draft for '$TAG'"
            gh release delete "$TAG" --yes
          elif gh release view "$TAG" >/dev/null 2>&1; then
            echo "release '$TAG' is already published and is never touched" >&2
            exit 1
          fi
          FLAGS="--draft --generate-notes --title $TAG"
          if [ "$PRE_RELEASE" = true ]; then FLAGS="$FLAGS --prerelease"; fi
          # shellcheck disable=SC2086
          gh release create "$TAG" dist/unboundair.jar $FLAGS

      - name: Publish the release
        # Last step on purpose: only a complete release with all assets
        # becomes immutable.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false
